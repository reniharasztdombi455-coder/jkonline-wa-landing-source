<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Continue to WhatsApp</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f4f7f5;color:#17211b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    main{width:min(100%,420px);padding:30px 24px;background:#fff;border:1px solid #e3eae5;border-radius:22px;text-align:center;box-shadow:0 12px 36px rgba(20,50,30,.08)}
    .icon{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:#25d366;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:700}
    h1{font-size:23px;margin:0 0 10px}p{color:#657168;line-height:1.6;font-size:15px}
    a{display:flex;justify-content:center;align-items:center;min-height:52px;margin-top:18px;border-radius:999px;background:#128c4a;color:white;text-decoration:none;font-weight:700;padding:12px 18px}
    #error{color:#a4261d}
    #timings{margin-top:16px;padding:12px;background:#f4f7f5;border-radius:12px;text-align:left;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">☎</div>
    <h1 id="heading">Your WhatsApp contact is ready</h1>
    <p id="detail">Your position code is ready. Click below when you are ready to continue.</p>
    <a id="manual" href="#" hidden>Continue to WhatsApp</a>
    <p id="error" hidden></p>
    <pre id="timings" hidden></pre>
  </main>
  <script>
    (async () => {
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const slug = (params.get("slug") || params.get("id") || "").trim();
      let sessionToken = "";
      let target = "";
      const debug = params.get("debug") === "1";
      const startedAt = performance.now();
      const timings = {};
      function showTimings() {
        const total = (performance.now() - startedAt).toFixed(0);
        $("timings").textContent = `诊断模式（不自动跳转）\\n预备资源领取接口：${timings.queueClaim ?? "-"} ms\\n页面准备总耗时：${total} ms\\n\\n点击下方按钮继续打开 WhatsApp。`;
        $("timings").hidden = false;
        $("heading").textContent = "耗时诊断完成";
        $("detail").textContent = "已记录跳转前的接口耗时。";
        $("manual").textContent = "继续前往 WhatsApp";
        $("manual").href = target;
        $("manual").hidden = false;
      }

      function setError(message) {
        $("heading").textContent = "WhatsApp contact is ready";
        $("detail").textContent = "Click the button below to open WhatsApp.";
        $("error").textContent = message;
        $("error").hidden = !message;
        if (target) {
          $("manual").href = target;
          $("manual").hidden = false;
        }
      }

      function makeWhatsAppUrl(phone, message) {
        const digits = String(phone || "").replace(/\D/g, "");
        if (digits.length < 8 || digits.length > 15) return "";
        const url = new URL("https://api.whatsapp.com/send/");
        url.searchParams.set("phone", digits);
        if (message) url.searchParams.set("text", message);
        url.searchParams.set("type", "phone_number");
        url.searchParams.set("app_absent", "0");
        return url.toString();
      }

      async function track(eventType, buttonType) {
        try {
          const response = await fetch("/api/track", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
              slug,
              session_token: sessionToken,
              event_type: eventType,
              button_type: buttonType || "direct",
              page_path: location.pathname,
              referrer_host: (() => { try { return document.referrer ? new URL(document.referrer).hostname : ""; } catch { return ""; } })()
            }),
            cache: "no-store",
            credentials: "same-origin",
            keepalive: true
          });
          if (!response.ok) return false;
          const result = await response.json().catch(() => ({}));
          return result.ok === true;
        } catch { return false; }
      }

      try {
        if (!slug || !/^[A-Za-z0-9_-]{1,60}$/.test(slug)) {
          throw new Error("This link is missing a valid ID.");
        }

        const storageKey = "wa_customer_session_" + slug;
        try {
          sessionToken = localStorage.getItem(storageKey) || "";
          if (!/^[A-Za-z0-9_-]{20,80}$/.test(sessionToken)) sessionToken = "";
          if (!sessionToken) {
            sessionToken = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)))
              .replace(/[^A-Za-z0-9_-]/g, "").slice(0,80);
            localStorage.setItem(storageKey, sessionToken);
          }
        } catch {
          sessionToken = (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2))
            .replace(/[^A-Za-z0-9_-]/g, "").slice(0,80);
        }

        // Claim one pre-reserved customer-code + WhatsApp-number pair in one request.
        const queueStarted = performance.now();
        const claimResponse = await fetch("/api/queue-claim", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({slug,session_token:sessionToken}),
          cache:"no-store",
          credentials:"same-origin"
        });
        const claimed = await claimResponse.json().catch(() => ({}));
        timings.queueClaim = (performance.now() - queueStarted).toFixed(0);
        if (!claimResponse.ok || !claimed.code || !claimed.message || !claimed.phone) {
          throw new Error(claimed.error || "Could not claim a ready WhatsApp pair.");
        }

        target = makeWhatsAppUrl(claimed.phone, claimed.message);
        if (!target) throw new Error("The assigned WhatsApp number is invalid.");

        $("manual").href = target;
        $("manual").hidden = false;
        $("detail").textContent = "Your position code is ready. Click below when you are ready to continue.";

        // Page views and actual user clicks are distinct from an automatic handoff attempt.
        void track("page_view", debug ? "diagnostic" : "manual");

        // Always wait for an explicit customer click before opening WhatsApp.
        $("manual").textContent = "Continue to WhatsApp";
        $("manual").addEventListener("click", (event) => {
          event.preventDefault();
          const destination = target || $("manual").href;
          void track("whatsapp_click", debug ? "diagnostic_button" : "manual_button");
          if (destination) location.href = destination;
        }, { once: true });

        if (debug) {
          showTimings();
        } else {
          $("heading").textContent = "Your WhatsApp contact is ready";
          $("detail").textContent = "Click the button below when you are ready to continue.";
          $("manual").hidden = false;
        }
      } catch (error) {
        setError(error && error.message ? error.message : "Please try again.");
      }
    })();
  </script>
</body>
</html>
