name: Static checks

on:
  push:
    branches: ["fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure API requests do not perform runtime DDL
        run: |
          if grep -RniE 'CREATE TABLE|ALTER TABLE|DROP TABLE' functions/api; then
            echo "Runtime DDL found in API handlers; schema changes belong in migrations."
            exit 1
          fi
      - name: Ensure legacy allocation endpoints are retired
        run: |
          for file in functions/api/assign-code.js functions/api/assign-wa.js; do
            grep -q 'status: 410' "$file" || { echo "Legacy endpoint is not retired: $file"; exit 1; }
            grep -q 'LEGACY_ENDPOINT_RETIRED' "$file" || { echo "Missing retirement response: $file"; exit 1; }
            if grep -Eq 'env\.DB|\.prepare\(|\.batch\(' "$file"; then
              echo "Legacy endpoint must not access D1: $file"
              exit 1
            fi
          done
          if grep -RniE '/api/assign-code|/api/assign-wa' index.html go functions --exclude='assign-code.js' --exclude='assign-wa.js'; then
            echo "A runtime client still references a retired allocation endpoint."
            exit 1
          fi
      - name: Check JavaScript files
        run: |
          find functions -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --input-type=module --check < "$file"; done
      - name: Check inline landing page script
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = [s for s in re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I) if s.strip()]
          for i, script in enumerate(scripts):
              pathlib.Path(f"/tmp/landing-inline-{i}.js").write_text(script, encoding="utf-8")
          PY
          for file in /tmp/landing-inline-*.js; do node --check "$file"; done
      - name: Validate D1 migration on SQLite
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(":memory:")
          db.executescript(pathlib.Path("migrations/0001_integrated_queue_schema.sql").read_text(encoding="utf-8"))
          db.executescript(pathlib.Path("migrations/0002_manager_shared_tables.sql").read_text(encoding="utf-8"))
          required = {"landing_code_counters", "customer_code_sessions", "wa_numbers", "wa_assignments", "wa_route_state", "wa_prefetch_queue", "wa_queue_refill_locks", "unique_customer_events", "customer_followups", "campaign_spend"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = required - actual
          assert not missing, f"Missing tables: {sorted(missing)}"
          db.execute("INSERT INTO customer_code_sessions(slug, session_token, customer_code) VALUES ('a','token-aaaaaaaaaaaaaaaaaaaa','F-HT-1027/-1')")
          try:
              db.execute("INSERT INTO customer_code_sessions(slug, session_token, customer_code) VALUES ('b','token-bbbbbbbbbbbbbbbbbbbb','F-HT-1027/-1')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError("Customer code must remain globally unique across links")
          print("D1 schema migration passed")
          PY
