name: Queue feature static checks

on:
  push:
    branches:
      - feature/wa-prefetch-queue
  pull_request:
    branches:
      - main

jobs:
  syntax-and-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare function syntax
        run: |
          set -euo pipefail
          for file in functions/api/queue-claim.js functions/api/assign-wa.js functions/api/track.js; do
            node --input-type=module --check < "$file"
          done
      - name: Check landing page JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("go/index.html", "utf8");
          const start = html.indexOf("<script>");
          const end = html.indexOf("</script>", start);
          if (start < 0 || end < 0) throw new Error("No inline script found");
          new Function(html.slice(start + 8, end));
          NODE
      - name: Verify queue integration and analytics semantics
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const api = fs.readFileSync("functions/api/queue-claim.js", "utf8");
          const page = fs.readFileSync("go/index.html", "utf8");
          const track = fs.readFileSync("functions/api/track.js", "utf8");
          const checks = [
            ["queue refill lock exists", api.includes("wa_queue_refill_locks")],
            ["claim uses compare-and-set", api.includes("WHERE id=? AND status='ready'")],
            ["landing page uses queue API", page.includes("/api/queue-claim")],
            ["open attempt has dedicated event", track.includes("whatsapp_open_attempt")],
            ["old automatic click event removed", !page.includes('void track("whatsapp_click", "direct")')]
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? "PASS " : "FAIL ") + name);
            if (!ok) process.exitCode = 1;
          }
          NODE

  isolated-local-d1-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler for local-only D1
        run: npm install --no-save wrangler
      - name: Initialize isolated local database fixture
        run: npx wrangler d1 execute jkonline-wa-local-test-only --local --config wrangler.test.toml --file tests/queue-fixture.sql
      - name: Start Pages against isolated local D1 and initialize queue tables
        run: |
          npx wrangler pages dev . --config wrangler.test.toml --ip 127.0.0.1 --port 8788 > /tmp/pages-dev.log 2>&1 &
          echo $! > /tmp/pages-dev.pid
          for i in $(seq 1 40); do
            if curl -sS -o /dev/null http://127.0.0.1:8788/ 2>/dev/null; then break; fi
            sleep 1
          done
          curl -sS -o /dev/null -X POST http://127.0.0.1:8788/api/queue-claim -H 'content-type: application/json' --data '{"slug":"queue-test","session_token":"session_test_token_0000_abcdefgh"}' || true
      - name: Seed test numbers into local-only D1
        run: npx wrangler d1 execute jkonline-wa-local-test-only --local --config wrangler.test.toml --file tests/queue-seed-numbers.sql
      - name: Verify idempotent and concurrent claims
        run: node tests/queue-smoke.test.cjs
      - name: Show local Pages logs on failure
        if: failure()
        run: cat /tmp/pages-dev.log || true
