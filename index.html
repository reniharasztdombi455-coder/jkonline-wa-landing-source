
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <meta name="description" content="Contact support on WhatsApp.">
  <title>Contact Us on WhatsApp</title>

  <style>
    :root {
      --green: #075e54;
      --green2: #128c7e;
      --ink: #17211f;
      --muted: #66736f;
      --line: #dce7e4;
      --error: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #f2f7f5;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 440px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 10px 34px rgba(7,94,84,.08);
      text-align: center;
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: var(--green);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    h1 {
      font-size: 25px;
      line-height: 1.3;
      margin: 0 0 10px;
      overflow-wrap: anywhere;
    }

    p {
      color: var(--muted);
      line-height: 1.65;
      margin: 0 0 16px;
    }

    .message {
      text-align: left;
      background: #f5f8f7;
      border: 1px solid var(--line);
      padding: 13px;
      border-radius: 12px;
      margin: 18px 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 14px 16px;
      border-radius: 13px;
      font-weight: 750;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .primary {
      background: var(--green);
      color: #fff;
    }

    .secondary {
      margin-top: 10px;
      background: #e8f5f1;
      color: var(--green);
      border: 1px solid #c8e4dc;
    }

    .btn:focus-visible {
      outline: 3px solid #69b7a9;
      outline-offset: 3px;
    }

    .small {
      font-size: 12px;
      margin-top: 18px;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 14px;
    }

    .status.error {
      color: var(--error);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo" aria-hidden="true">↗</div>

    <h1 id="page-title">Contact Us on WhatsApp</h1>

    <p id="page-description">
      Tap the button below to contact our support team.
    </p>

    <div class="message" id="message-box">
      <strong>Pre-filled message:</strong>
      <br>
      <span id="message-text">Loading...</span>
    </div>

    <a
      class="btn primary"
      id="primary-button"
      href="#"
      rel="noopener noreferrer"
      hidden
    >
      Continue to WhatsApp ↗
    </a>

    <a
      class="btn secondary"
      id="secondary-button"
      href="#"
      rel="noopener noreferrer"
      hidden
    >
      Open WhatsApp without a message
    </a>

    <p class="small" id="help-text">
      WhatsApp will not send your message automatically.
      Review the message and press Send yourself.
    </p>

    <p class="status" id="status" role="status" aria-live="polite">
      Loading page configuration...
    </p>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);

      const params = new URLSearchParams(location.search);
      const slug = (params.get("slug") || "").trim();

      let config = null;

      function cleanText(value, max = 500) {
        return String(value ?? "")
          .replace(/[\u0000-\u001f\u007f]/g, "")
          .trim()
          .slice(0, max);
      }

      function setStatus(message, isError = false) {
        $("status").textContent = message;
        $("status").classList.toggle("error", isError);
      }

      function whatsappUrl(phone, message = "") {
        const digits = String(phone || "").replace(/\D/g, "");

        if (digits.length < 8 || digits.length > 15) {
          return "";
        }

        const url = new URL("https://wa.me/" + digits);

        if (message) {
          url.searchParams.set("text", message);
        }

        return url.toString();
      }

      function track(eventType, buttonType = null) {
        if (!slug) return;

        const payload = {
          slug,
          event_type: eventType,
          button_type: buttonType,
          page_path: location.pathname,
          referrer_host: getReferrerHost()
        };

        try {
          fetch("/api/track", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload),
            keepalive: true,
            credentials: "same-origin"
          }).catch(() => {
            // 统计失败不应影响用户打开 WhatsApp。
          });
        } catch {
          // 统计失败不应影响页面使用。
        }
      }

      function getReferrerHost() {
        try {
          return document.referrer
            ? new URL(document.referrer).hostname.slice(0, 120)
            : "";
        } catch {
          return "";
        }
      }

      function bindButton(button, buttonType) {
        button.addEventListener("click", () => {
          track("whatsapp_click", buttonType);
          // 不拦截点击；浏览器按链接正常打开 WhatsApp。
        });
      }

      async function init() {
        if (!slug || !/^[a-zA-Z0-9_-]{1,80}$/.test(slug)) {
          setStatus(
            "缺少有效的落地页链接标识。请使用带有 ?slug=链接ID 的地址。",
            true
          );
          $("message-box").hidden = true;
          $("help-text").hidden = true;
          return;
        }

        track("page_view");

        try {
          const response = await fetch(
            "/api/landing?slug=" + encodeURIComponent(slug),
            {
              method: "GET",
              cache: "no-store",
              credentials: "same-origin"
            }
          );

          const result = await response.json().catch(() => ({}));

          if (!response.ok || !result.link) {
            throw new Error(
              result.error || "无法读取落地页配置，请稍后再试。"
            );
          }

          config = result.link;

          const title = cleanText(config.title, 140)
            || "Contact Us on WhatsApp";

          const description = cleanText(config.description, 500)
            || "Please tap the button below to continue.";

          const message = cleanText(config.message, 800);
          const buttonText = cleanText(config.button_text, 80)
            || "Open WhatsApp";

          const primaryUrl = whatsappUrl(config.phone, message);
          const secondaryUrl = whatsappUrl(config.phone);

          if (!primaryUrl || !secondaryUrl) {
            throw new Error("此落地页的 WhatsApp 国际号码无效。");
          }

          $("page-title").textContent = title;
          $("page-description").textContent = description;
          $("message-text").textContent = message || "No pre-filled message";

          document.title = title;
          document.documentElement.lang = "zh-CN";

          const primary = $("primary-button");
          primary.href = primaryUrl;
          primary.textContent = buttonText + " ↗";
          primary.hidden = false;

          const secondary = $("secondary-button");
          secondary.href = secondaryUrl;
          secondary.hidden = false;

          bindButton(primary, "primary");
          bindButton(secondary, "secondary");

          setStatus("");
          $("status").hidden = true;
        } catch (error) {
          setStatus(
            error.message || "加载失败，请稍后重试。",
            true
          );

          $("message-box").hidden = true;
          $("primary-button").hidden = true;
          $("secondary-button").hidden = true;
        }
      }

      init();
    })();
  </script>
</body>
</html>
