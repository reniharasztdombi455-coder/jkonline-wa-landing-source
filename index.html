
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <meta name="description" content="Contact your account manager on WhatsApp.">
  <title>点击前往 WhatsApp</title>

  <style>
    :root {
      --green: #075e54;
      --green-bright: #25d366;
      --ink: #17211f;
      --muted: #66736f;
      --line: #dce7e4;
      --surface: #f4f8f6;
      --error: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 16px
        max(18px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at top, rgba(37, 211, 102, .09), transparent 34%),
        #f3f7f5;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 440px);
      background: #fff;
      border: 1px solid rgba(7, 94, 84, .12);
      border-radius: 24px;
      padding: 30px 22px 24px;
      box-shadow: 0 16px 44px rgba(18, 54, 45, .09);
      text-align: center;
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 22px;
      background: var(--green-bright);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(37, 211, 102, .22);
    }

    .logo svg {
      display: block;
      width: 43px;
      height: 43px;
    }

    h1 {
      font-size: clamp(23px, 6vw, 27px);
      line-height: 1.3;
      letter-spacing: -.45px;
      margin: 0 0 13px;
      overflow-wrap: anywhere;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 20px;
      overflow-wrap: anywhere;
    }

    .message {
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 15px;
      border-radius: 14px;
      margin: 22px 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message-label {
      display: block;
      color: #354740;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 9px;
    }

    #message-text {
      display: block;
      color: #17211f;
      font-size: 15px;
      line-height: 1.65;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      padding: 15px 18px;
      border-radius: 14px;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 750;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: background-color .15s ease, transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .primary {
      background: var(--green);
      color: #fff;
      box-shadow: 0 7px 16px rgba(7, 94, 84, .18);
    }

    .primary:hover { background: #064e46; }
    .primary:active { transform: translateY(1px); }

    .btn:focus-visible {
      outline: 3px solid #69b7a9;
      outline-offset: 3px;
    }

    .status {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      margin: 14px 0 0;
    }

    .status.error { color: var(--error); }

    [hidden] { display: none !important; }

    @media (max-width: 360px) {
      main {
        padding: 25px 17px 20px;
        border-radius: 20px;
      }

      .logo {
        width: 62px;
        height: 62px;
        border-radius: 19px;
      }

      h1 { font-size: 23px; }
      p { font-size: 14px; }
      .btn { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>

<body>
  <main>
    <div class="logo" aria-label="WhatsApp" role="img">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#fff" d="M24 5.2A18.2 18.2 0 0 0 8.4 32.8L6 42l9.4-2.4A18.2 18.2 0 1 0 24 5.2Zm0 32.8c-2.8 0-5.5-.8-7.8-2.3l-.6-.4-5.6 1.5 1.5-5.5-.4-.6A14.2 14.2 0 1 1 24 38Z"/>
        <path fill="#fff" d="M31.8 27.1c-.4-.2-2.5-1.2-2.9-1.3-.4-.1-.7-.2-1 .2-.3.4-1.1 1.3-1.3 1.6-.2.3-.5.3-.9.1-.4-.2-1.8-.7-3.4-2.1-1.3-1.1-2.1-2.5-2.4-2.9-.2-.4 0-.6.2-.8l.7-.8c.2-.3.3-.4.4-.7.1-.3 0-.5 0-.7-.1-.2-.9-2.2-1.2-3-.3-.8-.7-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.4 3.9 1.6 4.2c.2.3 2.8 4.3 6.8 6 .9.4 1.6.6 2.1.7.9.3 1.8.2 2.4.1.7-.1 2.5-1 2.8-2 .3-1 .3-1.8.2-2-.1-.2-.4-.3-.8-.5Z"/>
      </svg>
    </div>

    <h1 id="page-title">点击前往 WhatsApp</h1>

    <p id="page-description">
      Please contact your assigned account manager via WhatsApp. Kindly send your position code to our customer service manager.
    </p>

    <div class="message" id="message-box">
      <span class="message-label">Here is your position code. Please send it to us.</span>
      <span id="message-text">Loading...</span>
    </div>

    <a
      class="btn primary"
      id="primary-button"
      href="#"
      rel="noopener noreferrer"
      hidden
    >
      Continue to WhatsApp ↗
    </a>

    <p class="status" id="status" role="status" aria-live="polite">
      Loading page configuration...
    </p>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const slug = (params.get("slug") || "").trim();

      function cleanText(value, max = 500) {
        return String(value ?? "")
          .replace(/[\u0000-\u001f\u007f]/g, "")
          .trim()
          .slice(0, max);
      }

      function setStatus(message, isError = false) {
        $("status").textContent = message;
        $("status").classList.toggle("error", isError);
      }

      function whatsappUrl(phone, message = "") {
        const digits = String(phone || "").replace(/\D/g, "");

        if (digits.length < 8 || digits.length > 15) return "";

        const url = new URL("https://wa.me/" + digits);

        if (message) {
          url.searchParams.set("text", message);
        }

        return url.toString();
      }

      function getReferrerHost() {
        try {
          return document.referrer
            ? new URL(document.referrer).hostname.slice(0, 120)
            : "";
        } catch {
          return "";
        }
      }

      function track(eventType, buttonType = null) {
        if (!slug) return;

        const payload = {
          slug,
          event_type: eventType,
          button_type: buttonType,
          page_path: location.pathname,
          referrer_host: getReferrerHost()
        };

        try {
          fetch("/api/track", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            keepalive: true,
            credentials: "same-origin"
          }).catch(() => {
            // Tracking failure must not prevent WhatsApp from opening.
          });
        } catch {
          // Tracking failure must not prevent page use.
        }
      }

      async function init() {
        if (!slug || !/^[a-zA-Z0-9_-]{1,80}$/.test(slug)) {
          setStatus(
            "Missing or invalid landing page link ID. Please use a URL containing ?slug=linkID.",
            true
          );
          $("message-box").hidden = true;
          return;
        }

        track("page_view");

        try {
          const response = await fetch(
            "/api/landing?slug=" + encodeURIComponent(slug),
            {
              method: "GET",
              cache: "no-store",
              credentials: "same-origin"
            }
          );

          const result = await response.json().catch(() => ({}));

          if (!response.ok || !result.link) {
            throw new Error(
              result.error || "Unable to load page configuration. Please try again later."
            );
          }

          const config = result.link;

          const description = cleanText(config.description, 500)
            || "Please contact your assigned account manager via WhatsApp. Kindly send your position code to our customer service manager.";

          const message = cleanText(config.message, 800);

          const buttonText = cleanText(config.button_text, 80)
            || "Continue to WhatsApp";

          const primaryUrl = whatsappUrl(config.phone, message);

          if (!primaryUrl) {
            throw new Error(
              "The WhatsApp international phone number for this page is invalid."
            );
          }

          // The heading and message label are fixed as requested.
          $("page-title").textContent = "点击前往 WhatsApp";
          $("page-description").textContent = description;
          $("message-text").textContent =
            message || "No position code has been configured.";

          document.title = "点击前往 WhatsApp";
          document.documentElement.lang = "en";

          const primary = $("primary-button");
          primary.href = primaryUrl;
          primary.textContent = buttonText + " ↗";
          primary.hidden = false;

          primary.addEventListener("click", () => {
            track("whatsapp_click", "primary");
          });

          setStatus("");
          $("status").hidden = true;
        } catch (error) {
          setStatus(
            error.message || "Loading failed. Please try again later.",
            true
          );

          $("message-box").hidden = true;
          $("primary-button").hidden = true;
        }
      }

      init();
    })();
  </script>
</body>
</html>
