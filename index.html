
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202020">
  <meta name="description" content="Connect with your dedicated account manager on WhatsApp.">
  <title>Click to Open WhatsApp</title>

  <style>
    :root {
      --ink: #111820;
      --muted: #777c82;
      --green: #25d366;
      --line: rgba(255,255,255,.72);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #bfc0c0;
      background-image:
        radial-gradient(ellipse at 78% 12%, rgba(255,255,255,.98) 0%, rgba(244,244,242,.88) 24%, transparent 48%),
        radial-gradient(ellipse at 8% 8%, rgba(28,28,28,.98) 0%, rgba(74,74,73,.90) 28%, transparent 55%),
        radial-gradient(ellipse at 92% 88%, rgba(74,74,73,.85) 0%, transparent 42%),
        linear-gradient(148deg, #282928 0%, #747574 34%, #f5f5f3 49%, #d7d8d6 72%, #737472 100%);
      background-attachment: fixed;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(145deg, transparent 0 44%, rgba(255,255,255,.58) 44.2%, rgba(255,255,255,.08) 44.7%, transparent 45.3%),
        linear-gradient(24deg, transparent 0 27%, rgba(20,20,20,.32) 27.1%, rgba(255,255,255,.36) 27.4%, transparent 28%),
        radial-gradient(ellipse at 50% 50%, transparent 0%, rgba(0,0,0,.09) 100%);
    }

    .card {
      width: min(100%, 650px);
      padding: 42px 42px 38px;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 30px;
      background: rgba(255,255,255,.78);
      box-shadow:
        0 30px 90px rgba(0,0,0,.20),
        0 3px 8px rgba(0,0,0,.04),
        inset 0 1px 0 rgba(255,255,255,.95);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      text-align: center;
    }

    .brand-icon {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      margin: 0 auto 27px;
      border-radius: 27px;
      background: var(--green);
      box-shadow:
        0 12px 30px rgba(37,211,102,.28),
        inset 0 1px 0 rgba(255,255,255,.35);
    }

    .brand-icon svg {
      display: block;
      width: 70px;
      height: 70px;
    }

    h1 {
      margin: 0;
      color: #111820;
      font-size: clamp(29px, 5vw, 42px);
      font-weight: 760;
      line-height: 1.3;
      letter-spacing: -1.15px;
      overflow-wrap: anywhere;
    }

    .subtitle {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 2.5vw, 20px);
      line-height: 1.8;
      letter-spacing: .1px;
      overflow-wrap: anywhere;
    }

    .divider {
      width: 76px;
      height: 1px;
      margin: 25px auto 28px;
      background: linear-gradient(90deg, transparent, rgba(80,80,80,.30), transparent);
    }

    .code-panel {
      padding: 24px 24px 23px;
      border: 1px solid rgba(255,255,255,.80);
      border-radius: 20px;
      background: rgba(255,255,255,.39);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    }

    .field-label {
      display: block;
      margin: 0 0 19px;
      color: #171a1d;
      font-size: clamp(14px, 2vw, 17px);
      font-weight: 700;
      line-height: 1.8;
      letter-spacing: .05px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .code-box {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 17px 19px;
      border: 1px solid rgba(25,35,30,.10);
      border-radius: 15px;
      background: rgba(255,255,255,.72);
      box-shadow:
        0 2px 7px rgba(0,0,0,.025),
        inset 0 1px 0 rgba(255,255,255,.85);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #message-text {
      color: #17191b;
      font-size: clamp(15px, 2.2vw, 19px);
      line-height: 1.8;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .primary {
      width: 100%;
      min-height: 72px;
      margin-top: 23px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 999px;
      background: linear-gradient(180deg, #292d2d 0%, #080a0a 100%);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: clamp(16px, 2.3vw, 19px);
      font-weight: 730;
      line-height: 1.5;
      letter-spacing: .1px;
      box-shadow:
        0 13px 25px rgba(0,0,0,.21),
        0 0 28px rgba(37,211,102,.09),
        inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .18s ease, box-shadow .18s ease;
      overflow-wrap: anywhere;
      -webkit-tap-highlight-color: transparent;
    }

    .primary:hover {
      box-shadow:
        0 16px 30px rgba(0,0,0,.25),
        0 0 32px rgba(37,211,102,.15),
        inset 0 1px 0 rgba(255,255,255,.25);
    }

    .primary:active { transform: translateY(1px); }

    .primary svg {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
    }

    .primary:focus-visible {
      outline: 3px solid rgba(37,211,102,.75);
      outline-offset: 5px;
    }

    .status {
      margin: 15px 0 0;
      color: #a4261d;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      body { padding: 22px 14px; }

      .card {
        width: 100%;
        padding: 30px 21px 24px;
        border-radius: 24px;
      }

      .brand-icon {
        width: 76px;
        height: 76px;
        margin-bottom: 23px;
        border-radius: 23px;
      }

      .brand-icon svg { width: 58px; height: 58px; }

      h1 {
        font-size: clamp(25px, 7vw, 33px);
        letter-spacing: -.65px;
      }

      .subtitle {
        margin-top: 12px;
        font-size: 15px;
      }

      .divider { margin: 22px auto 23px; }

      .code-panel {
        padding: 19px 14px 15px;
        border-radius: 17px;
      }

      .field-label {
        margin-bottom: 15px;
        font-size: 14px;
        line-height: 1.8;
      }

      .code-box {
        min-height: 70px;
        padding: 14px 12px;
      }

      #message-text { font-size: 15px; }

      .primary {
        min-height: 61px;
        margin-top: 18px;
        padding: 15px 17px;
        gap: 11px;
        font-size: 16px;
      }

      .primary svg { width: 25px; height: 25px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .primary { transition: none; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand-icon" role="img" aria-label="WhatsApp">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#fff" d="M24 5.2A18.2 18.2 0 0 0 8.4 32.8L6 42l9.4-2.4A18.2 18.2 0 1 0 24 5.2Zm0 32.8c-2.8 0-5.5-.8-7.8-2.3l-.6-.4-5.6 1.5 1.5-5.5-.4-.6A14.2 14.2 0 1 1 24 38Z"/>
        <path fill="#fff" d="M31.8 27.1c-.4-.2-2.5-1.2-2.9-1.3-.4-.1-.7-.2-1 .2-.3.4-1.1 1.3-1.3 1.6-.2.3-.5.3-.9.1-.4-.2-1.8-.7-3.4-2.1-1.3-1.1-2.1-2.5-2.4-2.9-.2-.4 0-.6.2-.8l.7-.8c.2-.3.3-.4.4-.7.1-.3 0-.5 0-.7-.1-.2-.9-2.2-1.2-3-.3-.8-.7-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.4 3.9 1.6 4.2c.2.3 2.8 4.3 6.8 6 .9.4 1.6.6 2.1.7.9.3 1.8.2 2.4.1.7-.1 2.5-1 2.8-2 .3-1 .3-1.8.2-2-.1-.2-.4-.3-.8-.5Z"/>
      </svg>
    </div>

    <h1 id="page-title">Click to Open WhatsApp</h1>

    <p class="subtitle" id="page-description">
      You will be assigned a dedicated account manager.
    </p>

    <div class="divider" aria-hidden="true"></div>

    <section class="code-panel">
      <span class="field-label">
        Here is your position code. Please send it to your account manager.
      </span>

      <div class="code-box" id="message-box">
        <span id="message-text">Loading...</span>
      </div>
    </section>

    <a
      class="primary"
      id="primary-button"
      href="#"
      rel="noopener noreferrer"
      hidden
    >
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#25d366" d="M24 5.2A18.2 18.2 0 0 0 8.4 32.8L6 42l9.4-2.4A18.2 18.2 0 1 0 24 5.2Zm0 32.8c-2.8 0-5.5-.8-7.8-2.3l-.6-.4-5.6 1.5 1.5-5.5-.4-.6A14.2 14.2 0 1 1 24 38Z"/>
        <path fill="#fff" d="M31.8 27.1c-.4-.2-2.5-1.2-2.9-1.3-.4-.1-.7-.2-1 .2-.3.4-1.1 1.3-1.3 1.6-.2.3-.5.3-.9.1-.4-.2-1.8-.7-3.4-2.1-1.3-1.1-2.1-2.5-2.4-2.9-.2-.4 0-.6.2-.8l.7-.8c.2-.3.3-.4.4-.7.1-.3 0-.5 0-.7-.1-.2-.9-2.2-1.2-3-.3-.8-.7-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.4 3.9 1.6 4.2c.2.3 2.8 4.3 6.8 6 .9.4 1.6.6 2.1.7.9.3 1.8.2 2.4.1.7-.1 2.5-1 2.8-2 .3-1 .3-1.8.2-2-.1-.2-.4-.3-.8-.5Z"/>
      </svg>
      <span id="button-label">Click to Send</span>
    </a>

    <p class="status" id="status" role="status" aria-live="polite" hidden></p>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const slug = (params.get("slug") || "").trim();

      function cleanText(value, max = 500) {
        return String(value ?? "")
          .replace(/[\u0000-\u001f\u007f]/g, "")
          .trim()
          .slice(0, max);
      }

      function setStatus(message, isError = false) {
        $("status").textContent = message;
        $("status").classList.toggle("error", isError);
        $("status").hidden = !message;
      }

      function whatsappUrl(phone, message = "") {
        const digits = String(phone || "").replace(/\D/g, "");

        if (digits.length < 8 || digits.length > 15) return "";

        const url = new URL("https://wa.me/" + digits);

        if (message) {
          url.searchParams.set("text", message);
        }

        return url.toString();
      }

      function getReferrerHost() {
        try {
          return document.referrer
            ? new URL(document.referrer).hostname.slice(0, 120)
            : "";
        } catch {
          return "";
        }
      }

      function track(eventType, buttonType = null) {
        if (!slug) return;

        const payload = {
          slug,
          event_type: eventType,
          button_type: buttonType,
          page_path: location.pathname,
          referrer_host: getReferrerHost()
        };

        try {
          fetch("/api/track", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            keepalive: true,
            credentials: "same-origin"
          }).catch(() => {});
        } catch {}
      }

      async function init() {
        if (!slug || !/^[a-zA-Z0-9_-]{1,80}$/.test(slug)) {
          setStatus("Missing or invalid landing page link ID.", true);
          $("message-box").hidden = true;
          return;
        }

        track("page_view");

        try {
          const response = await fetch(
            "/api/landing?slug=" + encodeURIComponent(slug),
            {
              method: "GET",
              cache: "no-store",
              credentials: "same-origin"
            }
          );

          const result = await response.json().catch(() => ({}));

          if (!response.ok || !result.link) {
            throw new Error(
              result.error || "Unable to load page configuration. Please try again."
            );
          }

          const config = result.link;
          const message = cleanText(config.message, 800);
          const target = whatsappUrl(config.phone, message);

          if (!target) {
            throw new Error("The WhatsApp phone number configured for this page is invalid.");
          }

          // Fixed English copy; the position code remains dynamic in D1.
          $("page-title").textContent = "Click to Open WhatsApp";
          $("page-description").textContent =
            "You will be assigned a dedicated account manager.";
          $("message-text").textContent =
            message || "No position code has been configured.";

          document.title = "Click to Open WhatsApp";
          document.documentElement.lang = "en";

          $("primary-button").href = target;
          $("button-label").textContent = "Click to Send";
          $("primary-button").hidden = false;

          $("primary-button").addEventListener("click", () => {
            track("whatsapp_click", "primary");
          });

          setStatus("");
        } catch (error) {
          setStatus(
            error.message || "Loading failed. Please try again later.",
            true
          );

          $("message-box").hidden = true;
          $("primary-button").hidden = true;
        }
      }

      init();
    })();
  </script>
</body>
</html>
